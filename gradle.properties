pluginGroup=app.heckit.ide.latherit
pluginVersion=0.2.0
# Ab 2026.2 ist JCEF ein eigenes mitgeliefertes Plugin (com.intellij.modules.jcef).
pluginSinceBuild=262

# Zielplattform zum Kompilieren und für runIde. PhpStorm platformVersion wird heruntergeladen,
# außer local.properties enthält platformLocalPath (Pfad zu einer installierten IDE, siehe README).
platformVersion=2026.2

# Checkout von LatherIt (Oberfläche, nicht öffentlich), relativ zu diesem Projekt. Rechnerspezifisch
# lässt er sich in local.properties überschreiben (latheritDir=…).
latheritDir=../../latherit
# Befehl für den Build der Oberfläche, z. B. npm oder ein voller Pfad.
npmCommand=npm

kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
